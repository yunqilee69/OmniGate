name: release

# 仅在推送形如 v* 的 tag 时触发:全面测试 → 构建发行包 → 发布 npm
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 GitHub Release
  id-token: write   # npm provenance 签名(OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # 不要中断正在进行的发布

jobs:
  # ---------- 1. 全面测试:三大平台矩阵跑 vet + test ----------
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run go tests
        run: go test ./... -count=1

  # ---------- 2. 构建发行包:goreleaser 6 目标交叉编译 + GitHub Release ----------
  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser 生成 changelog 需要完整历史
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # web 工具链是 npm(锁文件 web/package-lock.json),不用 pnpm
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # goreleaser 的 before.hooks 会自动跑 npm ci + build,
      # 这里再显式跑一遍前置校验,失败更早暴露。
      - name: Pre-build web bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # vite build 不做类型检查,发布前显式过一遍 tsc
      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      - name: Install goreleaser
        run: go install github.com/goreleaser/goreleaser/v2@latest

      # 先 dry-run 校验配置与构建,失败更早暴露
      - name: Build check (snapshot)
        run: goreleaser release --snapshot --clean --skip=publish --skip=announce

      - name: Publish release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 3. 发布 npm:版本号同步 tag,postinstall 从上一步的 Release 拉二进制 ----------
  npm-publish:
    needs: release   # 必须等二进制落到 GitHub Release,postinstall 才拉得到
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Sync version from tag
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::secret NPM_TOKEN 未配置,跳过 npm publish(配置方法见 docs/RELEASE.md §4.2)"
            exit 0
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            # 预发布版本(-rc/-beta)发到 @next,@latest 保持 stable
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
